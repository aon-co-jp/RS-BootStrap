[package]
name = "rs-bootstrap"
description = "RS-BootStrap (formerly RBootstrap): a from-scratch Rust Bootstrap-compatible grid system and component style generator, built on rcss3's selector/declaration types."
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/aon-co-jp/RS-BootStrap"

[lints.rust]
unsafe_code = "deny"

[dependencies]
rcss3 = { git = "https://github.com/aon-co-jp/RS-CSS" }

